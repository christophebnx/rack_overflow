[project]
name = "rack-overflow"
version = "0.1.0"
description = "Personal training tracker: exercise catalog, session templates, set logging and progress tracking, as a responsive web app."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rack = "rack_overflow.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.8",
    "ruff>=0.6",
    "pylint>=3.2",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rack_overflow"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a real paid or remote service (costs money, needs network); never run by default",
]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["rack_overflow"]

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-comments = true
ignore-docstrings = true
